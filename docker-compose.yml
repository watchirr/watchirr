# Self-host (no hot reload). For development with Fast Refresh: npm run docker:dev
services:
  watchirr:
    build: .
    ports:
      - "3001:3000"
    volumes:
      - watchirr-data:/data
    environment:
      DATA_DIR: /data
      # DATABASE_URL: postgres://watchirr:watchirr@db:5432/watchirr

volumes:
  watchirr-data:
